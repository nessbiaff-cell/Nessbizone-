<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nessbizone</title>
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#14213d;--mu:#5d6882;--ac:#fca311;--acx:#14213d;--bd:#d9dfeb;--hd:#14213d;--hdx:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--tx:#eef1f6;--mu:#98a3bd;--bd:#2a3556;--hd:#172038}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:var(--hdx);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header div{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}.logo b{color:var(--ac)}
main{max-width:560px;margin:0 auto;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.6rem;line-height:1.15;margin:.3em 0 .2em;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
label{font-size:.9rem;color:var(--mu)}
input,textarea{width:100%;padding:12px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button,.btn{display:inline-block;padding:12px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.hd .sec{color:var(--hdx);border-color:#ffffff55;padding:8px 12px}
.full{width:100%}.muted{color:var(--mu);font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.p img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:block}
.p .in{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.p .pr{font-weight:800}.p .btn{margin-top:auto;padding:10px;font-size:.9rem}
.note{padding:10px 12px;border-radius:8px;background:var(--bd);margin:10px 0}
.err{background:#ffd9d4;color:#6b1208}
.link{word-break:break-all;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="hd"><div><span class="logo">Nessbi<b>zone</b></span><span id="hr"></span></div></header>
<main id="app"><p class="muted">Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://vlsvpcsnyurxrpqxpghx.supabase.co";
const SB_KEY="sb_publishable_AYdPLaRLYJO9zsLT7x0-Xw__rx5yDjV";
const PRIX=1500;
const PAIEMENT_AUTO=false;          // passe à true quand le paiement automatique sera branché
const WA_ADMIN="22673306209";        // ton numéro WhatsApp avec l’indicatif, sans + ni espaces
const actif=v=>v.abonnement_actif&&(!v.abonnement_fin||new Date(v.abonnement_fin)>new Date());
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById("app"),hr=document.getElementById("hr");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"boutique";
const fcfa=n=>Number(n).toLocaleString("fr-FR")+" FCFA";
const wa=n=>{let d=String(n||"").replace(/\D/g,"");if(d.length===8)d="226"+d;return d};
const note=(t,e)=>`<div class="note ${e?"err":""}" role="alert">${esc(t)}</div>`;
const base=()=>location.origin+location.pathname;

async function init(){
  const b=new URLSearchParams(location.search).get("b");
  if(b)return boutique(b);
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return accueil();
  try{const r=new URLSearchParams(location.search).get("paiement");if(r){history.replaceState(null,"",base());try{await sb.functions.invoke("ligdicash",{body:{action:"verifier"}})}catch{}}const v=await vendeur(session.user);tableau(v,r?"Paiement reçu. Ton abonnement s’active dans quelques instants : recharge la page si besoin.":null)}catch(e){accueil(e.message)}
}

function accueil(erreur,mode="in",info){
  hr.innerHTML="";
  const ins=mode==="up";
  app.innerHTML=`<h1>Vends mieux sur WhatsApp</h1>
  <p class="muted">Crée ta boutique en ligne, ajoute tes produits et partage un seul lien à tes clients.</p>
  <div class="card">
  <div class="tabs"><button class="${ins?"sec":""}" id="t1">Connexion</button><button class="${ins?"":"sec"}" id="t2">Créer ma boutique</button></div>
  ${erreur?note(erreur,1):""}${info?note(info):""}
  <form id="f">
  ${ins?`<label>Nom de ta boutique</label><input name="boutique" required maxlength="50" placeholder="Chez Awa">
  <label>Numéro WhatsApp (avec l’indicatif)</label><input name="whatsapp" required inputmode="tel" placeholder="22670123456">`:""}
  <label>E-mail</label><input name="email" type="email" required autocomplete="email">
  <label>Mot de passe (6 caractères minimum)</label><input name="pw" type="password" required minlength="6" autocomplete="${ins?"new-password":"current-password"}">
  <button class="full">${ins?"Créer ma boutique":"Me connecter"}</button></form></div>`;
  document.getElementById("t1").onclick=()=>accueil();
  document.getElementById("t2").onclick=()=>accueil(null,"up");
  document.getElementById("f").onsubmit=async e=>{
    e.preventDefault();const f=e.target,btn=f.querySelector("button");btn.disabled=true;
    const email=f.email.value.trim(),password=f.pw.value;
    if(ins){
      const boutique=f.boutique.value.trim();
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{boutique,slug:slugify(boutique),whatsapp:f.whatsapp.value.trim()}}});
      if(error)return accueil(error.message,"up");
      if(!data.session)return accueil(null,"in","Compte créé. Confirme ton e-mail avec le lien reçu, puis connecte-toi.");
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)return accueil("E-mail ou mot de passe incorrect.");
    }
    init();
  };
}

async function vendeur(user){
  let {data,error}=await sb.from("vendeurs").select("*").eq("id",user.id).maybeSingle();
  if(error)throw error;
  if(data)return data;
  const m=user.user_metadata||{};let slug=m.slug||slugify(m.boutique||"");
  for(let i=0;i<4;i++){
    const r=await sb.from("vendeurs").insert({id:user.id,boutique:m.boutique||"Ma boutique",slug,whatsapp:m.whatsapp||""}).select().single();
    if(!r.error)return r.data;
    if(r.error.code==="23505")slug+="-"+Math.floor(100+Math.random()*900);else throw r.error;
  }
  throw new Error("Impossible de créer la boutique.");
}

function reduire(file){
  return createImageBitmap(file).then(img=>{
    const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return new Promise(r=>c.toBlob(r,"image/jpeg",.8));
  });
}

async function tableau(v,msg,err){
  hr.innerHTML='<button class="sec" id="out">Déconnexion</button>';
  document.getElementById("out").onclick=async()=>{await sb.auth.signOut();accueil()};
  const {data:ps,error}=await sb.from("produits").select("*").eq("vendeur_id",v.id).order("created_at",{ascending:false});
  const liste=ps||[],plein=!actif(v);
  const lien=`${base()}?b=${v.slug}`;
  const partage="https://wa.me/?text="+encodeURIComponent(`Découvre ma boutique ${v.boutique} : ${lien}`);
  app.innerHTML=`<h1>${esc(v.boutique)}</h1>
  ${msg?note(msg,err):""}${error?note(error.message,1):""}
  <div class="card"><h2>Abonnement</h2>${actif(v)?`<p>Actif${v.abonnement_fin?" jusqu’au "+new Date(v.abonnement_fin).toLocaleDateString("fr-FR"):""}. Produits illimités.</p>`:`<p class="muted">Abonnement requis pour ajouter des produits et garder ta boutique en ligne.</p>`}<button id="ab" class="full">${actif(v)?"Prolonger":"S’abonner"} · ${fcfa(PRIX)} / mois</button>${PAIEMENT_AUTO?"":'<p class="muted">Paiement par Orange Money : écris-nous sur WhatsApp, nous activons ton abonnement dès réception.</p>'}</div>
  <div class="card"><h2>Ton lien boutique</h2><p class="link">${esc(lien)}</p>
  <div class="row"><button id="cp">Copier le lien</button><a class="btn sec" href="${partage}" target="_blank" rel="noopener">Partager sur WhatsApp</a><a class="btn sec" href="${esc(lien)}" target="_blank" rel="noopener">Voir ma boutique</a></div></div>
  <div class="card"><h2>Ajouter un produit</h2>
  ${plein?note(`Abonne-toi pour ajouter des produits.`):`
  <form id="fp"><label>Nom du produit</label><input name="nom" required maxlength="80">
  <label>Prix (FCFA)</label><input name="prix" type="number" required min="0" inputmode="numeric">
  <label>Description (facultatif)</label><textarea name="desc" rows="2" maxlength="300"></textarea>
  <label>Photo</label><input name="photo" type="file" accept="image/*">
  <button class="full">Ajouter le produit</button></form>`}</div>
  <h2>Mes produits (${liste.length})</h2>
  ${liste.length?`<div class="grid">${liste.map(p=>`<div class="p">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.nom)}" loading="lazy">`:'<div class="ph"></div>'}<div class="in"><b>${esc(p.nom)}</b><span class="pr">${fcfa(p.prix)}</span><button class="sec" data-del="${p.id}">Supprimer</button></div></div>`).join("")}</div>`:'<p class="muted">Aucun produit pour l’instant. Ajoute le premier ci-dessus.</p>'}`;
  document.getElementById("cp").onclick=async e=>{try{await navigator.clipboard.writeText(lien);e.target.textContent="Lien copié"}catch{prompt("Copie ce lien :",lien)}};
  document.getElementById("ab").onclick=async e=>{
    if(!PAIEMENT_AUTO){
      const t=encodeURIComponent(`Bonjour, je veux m’abonner à Nessbizone (${fcfa(PRIX)} / mois). Ma boutique : ${v.boutique} (${v.slug}).`);
      window.open(`https://wa.me/${WA_ADMIN}?text=${t}`,"_blank","noopener");return;
    }
    e.target.disabled=true;e.target.textContent="Redirection…";
    const {data,error}=await sb.functions.invoke("ligdicash",{body:{action:"creer"}});
    if(error||!data?.url)return tableau(v,"Paiement indisponible pour le moment. Réessaie plus tard.",true);
    location.href=data.url;
  };
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Supprimer ce produit ?"))return;
    const r=await sb.from("produits").delete().eq("id",b.dataset.del);
    tableau(v,r.error?r.error.message:"Produit supprimé.",!!r.error);
  });
  const fp=document.getElementById("fp");
  if(fp)fp.onsubmit=async e=>{
    e.preventDefault();const btn=fp.querySelector("button");btn.disabled=true;btn.textContent="Envoi en cours…";
    let url=null;const file=fp.photo.files[0];
    try{
      if(file){
        const path=`${v.id}/${Date.now()}.jpg`;
        const up=await sb.storage.from("produits").upload(path,await reduire(file),{contentType:"image/jpeg"});
        if(up.error)throw up.error;
        url=sb.storage.from("produits").getPublicUrl(path).data.publicUrl;
      }
      const r=await sb.from("produits").insert({vendeur_id:v.id,nom:fp.nom.value.trim(),prix:Number(fp.prix.value),description:fp.desc.value.trim()||null,photo_url:url});
      if(r.error)throw r.error;
      tableau(v,"Produit ajouté.");
    }catch(x){tableau(v,"Échec de l’ajout : "+x.message,true)}
  };
}

async function boutique(slug){
  const {data:v}=await sb.from("vendeurs").select("*").eq("slug",slug).maybeSingle();
  if(!v){app.innerHTML="<h1>Boutique introuvable</h1><p class=\"muted\">Vérifie le lien que tu as reçu.</p>";return}
  if(!actif(v)){app.innerHTML="<h1>Boutique indisponible</h1><p class=\"muted\">Cette boutique n’est pas active pour le moment.</p>";return}
  document.title=v.boutique+" – Nessbizone";
  const {data:ps}=await sb.from("produits").select("*").eq("vendeur_id",v.id).order("created_at",{ascending:false});
  const num=wa(v.whatsapp);
  app.innerHTML=`<h1>${esc(v.boutique)}</h1>
  ${(ps||[]).length?`<div class="grid">${ps.map(p=>{
    const t=encodeURIComponent(`Bonjour, je veux commander : ${p.nom} (${fcfa(p.prix)}). Est-il disponible ?`);
    return `<div class="p">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.nom)}" loading="lazy">`:'<div class="ph"></div>'}<div class="in"><b>${esc(p.nom)}</b>${p.description?`<span class="muted">${esc(p.description)}</span>`:""}<span class="pr">${fcfa(p.prix)}</span><a class="btn" href="https://wa.me/${num}?text=${t}" target="_blank" rel="noopener">Commander sur WhatsApp</a></div></div>`}).join("")}</div>`:'<p class="muted">Cette boutique n’a pas encore de produits.</p>'}
  <p class="muted" style="margin-top:24px">Boutique créée avec <a href="${esc(base())}">Nessbizone</a></p>`;
}

init();
</script>
</body>
</html>
